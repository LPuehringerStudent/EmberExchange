<div class="page-background fixed inset-0 pointer-events-none z-0 overflow-hidden" [class]="'theme-' + theme()">
  <!-- Animated mesh blobs -->
  <div class="bg-mesh absolute inset-0">
    <div class="mesh-blob mesh-1"></div>
    <div class="mesh-blob mesh-2"></div>
    <div class="mesh-blob mesh-3"></div>
  </div>

  <!-- Floating ember particles -->
  <div class="embers-layer absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="ember-particle ember-1"></div>
    <div class="ember-particle ember-2"></div>
    <div class="ember-particle ember-3"></div>
    <div class="ember-particle ember-4"></div>
    <div class="ember-particle ember-5"></div>
    <div class="ember-particle ember-6"></div>
    <div class="ember-particle ember-7"></div>
    <div class="ember-particle ember-8"></div>
  </div>

  <!-- Grain texture overlay -->
  <div class="grain-overlay absolute inset-0"></div>
</div>

<ng-content></ng-content>

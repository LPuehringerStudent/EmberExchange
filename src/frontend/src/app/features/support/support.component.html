<div class="support-container">
  <header class="support-header">
    <h1>Support</h1>
    <p>Report a bug, request a feature, or ask for help</p>
  </header>

  @if (success()) {
    <div class="alert success">
      <strong>Ticket submitted!</strong> We'll get back to you as soon as possible.
    </div>
  }

  @if (error()) {
    <div class="alert error">
      <strong>Error:</strong> {{ error() }}
    </div>
  }

  <form class="support-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title <span class="required">*</span></label>
      <input
        id="title"
        type="text"
        [(ngModel)]="form().title"
        name="title"
        placeholder="Short summary of your issue"
        required
        [disabled]="loading()"
      />
    </div>

    <div class="form-group">
      <label for="type">Category <span class="required">*</span></label>
      <select id="type" [(ngModel)]="form().type" name="type" [disabled]="loading()">
        <option value="bug">Bug Report</option>
        <option value="feature">Feature Request</option>
        <option value="support">General Support</option>
      </select>
    </div>

    <div class="form-group">
      <label for="priority">Priority <span class="required">*</span></label>
      <select id="priority" [(ngModel)]="form().priority" name="priority" [disabled]="loading()">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">Description <span class="required">*</span></label>
      <textarea
        id="description"
        [(ngModel)]="form().description"
        name="description"
        rows="6"
        placeholder="Describe your issue in detail..."
        required
        [disabled]="loading()"
      ></textarea>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner"></span> Submitting...
      } @else {
        Submit Ticket
      }
    </button>
  </form>
</div>
